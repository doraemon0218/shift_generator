<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>シフト希望入力</title>
<style>
  :root {
    --available:   #f8fafc;
    --no-late:     #fff3cd;
    --no-night:    #ede9fe;
    --night-wish:  #dbeafe;
    --off-req:     #dcfce7;
    --late-wish:   #ffedd5;
    --paid-leave:  #ccfbf1;
    --col-available:  #64748b;
    --col-no-late:    #b45309;
    --col-no-night:   #7c3aed;
    --col-night-wish: #1d4ed8;
    --col-off-req:    #15803d;
    --col-late-wish:  #ea580c;
    --col-paid-leave: #0f766e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif; background: #f0f4f8; min-height: 100vh; }

  header { background: #1e3a5f; color: white; padding: 12px 16px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header-top h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.85); padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
  .nurse-info { font-size: 12px; color: #93c5fd; margin-top: 4px; }
  .nurse-badge { display: inline-block; background: rgba(255,255,255,0.15); border-radius: 4px; padding: 1px 6px; margin-left: 6px; font-size: 11px; }

  .deadline-banner { padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .deadline-banner.safe    { background: #eff6ff; color: #1d4ed8; border-bottom: 1px solid #bfdbfe; }
  .deadline-banner.warning { background: #fffbeb; color: #92400e; border-bottom: 1px solid #fde68a; }
  .deadline-banner.urgent  { background: #fff1f2; color: #be123c; border-bottom: 1px solid #fecdd3; animation: pulse 2s infinite; }
  .deadline-banner.expired { background: #f1f5f9; color: #64748b; border-bottom: 1px solid #e2e8f0; }
  .deadline-days { margin-left: auto; font-size: 20px; font-weight: 800; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.75} }

  .month-nav { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 16px; background: white; border-bottom: 1px solid #e2e8f0; }
  .month-nav button { background: #f1f5f9; border: none; font-size: 18px; cursor: pointer; color: #475569; padding: 6px 14px; border-radius: 8px; font-weight: 700; }
  .month-nav button:disabled { color: #cbd5e0; background: #f8fafc; cursor: not-allowed; }
  .month-nav h2 { font-size: 19px; font-weight: 800; color: #1e293b; min-width: 130px; text-align: center; }

  .counters { display: flex; gap: 6px; padding: 8px 12px; background: white; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 700; }
  .chip.off        { background: var(--off-req);    color: var(--col-off-req); }
  .chip.paid       { background: var(--paid-leave); color: var(--col-paid-leave); }
  .chip.late       { background: var(--late-wish);  color: var(--col-late-wish); }
  .chip.night      { background: var(--night-wish); color: var(--col-night-wish); }
  .chip.warn       { background: #fee2e2; color: #b91c1c; }
  .chip.submitted  { background: #d1fae5; color: #065f46; }
  .chip.progress   { background: #f1f5f9; color: #475569; }

  .calendar-wrap { padding: 10px 10px 4px; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
  .weekday { text-align: center; font-size: 11px; font-weight: 700; padding: 4px 0; color: #94a3b8; }
  .weekday.sun { color: #ef4444; }
  .weekday.sat { color: #3b82f6; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

  .day-cell {
    min-height: 62px;
    border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    border: 2px solid transparent;
    transition: transform 0.1s, box-shadow 0.1s;
    background: var(--available);
    user-select: none; overflow: hidden;
  }
  .day-cell:active:not(.empty):not(.locked) { transform: scale(0.9); }
  .day-cell.empty   { background: transparent; cursor: default; border: none; min-height: 62px; }
  .day-cell.today   { border-color: #3b82f6 !important; box-shadow: 0 0 0 1px #93c5fd; }
  .day-cell.locked  { cursor: not-allowed; opacity: 0.55; }
  .day-cell.auto-off { background: #f1f5f9 !important; cursor: not-allowed; border-color: transparent !important; }

  .day-cell.sunday   .day-num { color: #ef4444; }
  .day-cell.saturday .day-num { color: #3b82f6; }
  .day-cell.sunday   { background: #fef9f9; }
  .day-cell.saturday { background: #f8fbff; }

  .day-cell[data-pref="no_late"]    { background: var(--no-late); }
  .day-cell[data-pref="no_night"]   { background: var(--no-night); }
  .day-cell[data-pref="night_wish"] { background: var(--night-wish); border-color: #93c5fd; }
  .day-cell[data-pref="off_request"]{ background: var(--off-req);   border-color: #86efac; }
  .day-cell[data-pref="late_wish"]  { background: var(--late-wish); border-color: #fed7aa; }
  .day-cell[data-pref="paid_leave"] { background: var(--paid-leave);border-color: #99f6e4; }

  .day-num   { font-size: 18px; font-weight: 800; line-height: 1; color: #1e293b; }
  .day-label { font-size: 11px; font-weight: 700; margin-top: 3px; line-height: 1; }

  .day-cell[data-pref="available"]   .day-label { display: none; }
  .day-cell[data-pref="no_late"]     .day-label { color: var(--col-no-late); }
  .day-cell[data-pref="no_night"]    .day-label { color: var(--col-no-night); }
  .day-cell[data-pref="night_wish"]  .day-label { color: var(--col-night-wish); }
  .day-cell[data-pref="off_request"] .day-label { color: var(--col-off-req); }
  .day-cell[data-pref="late_wish"]   .day-label { color: var(--col-late-wish); }
  .day-cell[data-pref="paid_leave"]  .day-label { color: var(--col-paid-leave); }
  .day-cell.auto-off .day-label { color: #94a3b8; font-size: 10px; }

  .legend { padding: 8px 12px; background: white; border-bottom: 1px solid #e2e8f0; }
  .legend-inner { display: flex; gap: 6px; flex-wrap: wrap; }
  .legend-item { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
  .legend-item.l-available  { background: var(--available);  color: var(--col-available); border: 1px solid #e2e8f0; }
  .legend-item.l-no-late    { background: var(--no-late);    color: var(--col-no-late); }
  .legend-item.l-no-night   { background: var(--no-night);   color: var(--col-no-night); }
  .legend-item.l-night-wish { background: var(--night-wish); color: var(--col-night-wish); }
  .legend-item.l-off-req    { background: var(--off-req);    color: var(--col-off-req); }
  .legend-item.l-late-wish  { background: var(--late-wish);  color: var(--col-late-wish); }
  .legend-item.l-paid-leave { background: var(--paid-leave); color: var(--col-paid-leave); }

  .note-section { padding: 12px; background: white; border-top: 1px solid #e2e8f0; margin-top: 6px; }
  .note-label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
  .note-textarea {
    width: 100%; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; font-family: inherit;
    resize: vertical; min-height: 72px; color: #1e293b;
    background: #f8fafc; outline: none;
  }
  .note-textarea:focus { border-color: #3b82f6; background: white; }
  .note-saved { font-size: 11px; color: #22c55e; margin-top: 4px; height: 16px; }

  /* スコアカード */
  .score-section { margin: 6px 10px 4px; background: white; border-radius: 12px; padding: 14px 16px; border: 1px solid #e2e8f0; }
  .score-title { font-size: 13px; font-weight: 800; color: #1e293b; margin-bottom: 10px; }
  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .score-item { background: #f8fafc; border-radius: 10px; padding: 10px 12px; text-align: center; }
  .score-val { font-size: 24px; font-weight: 800; color: #1e3a5f; line-height: 1; }
  .score-unit { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .score-desc { font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 600; }

  .submit-bar { position: sticky; bottom: 0; padding: 12px 16px env(safe-area-inset-bottom, 12px); background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; }
  .submit-btn {
    flex: 1; padding: 15px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 800; cursor: pointer;
    background: #1d4ed8; color: white; transition: background 0.2s;
    letter-spacing: 0.03em;
  }
  .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .submit-btn.submitted { background: #15803d; }
  .submit-btn.expired   { background: #64748b; }
  .unsubmit-btn {
    flex: 0 0 auto; padding: 15px 18px; border-radius: 12px;
    border: 2px solid #dc2626; background: white; color: #dc2626;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .unsubmit-btn:hover { background: #fef2f2; }

  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 10px 20px; border-radius: 9999px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .toast.show { opacity: 1; }

  .sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 50; }
  .sheet-overlay.open { display: block; }
  .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-radius: 24px 24px 0 0; padding: 0 0 env(safe-area-inset-bottom, 16px); z-index: 51; transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.32,0.72,0,1); }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 14px auto 0; }
  .sheet-date { text-align: center; font-size: 15px; font-weight: 800; color: #1e293b; padding: 10px 0 14px; border-bottom: 1px solid #f1f5f9; }
  .sheet-options { padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }

  .option-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 14px; border: 2px solid transparent;
    cursor: pointer; width: 100%; text-align: left; transition: all 0.15s;
    background: #f8fafc;
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.selected { border-color: currentColor; }
  .option-btn.disabled { opacity: 0.38; cursor: not-allowed; }
  .opt-icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
  .opt-name { font-size: 15px; font-weight: 700; }
  .opt-desc { font-size: 12px; opacity: 0.65; margin-top: 2px; }
  .opt-check { margin-left: auto; font-size: 20px; color: currentColor; }

  .option-btn.o-available  { color: #475569; }
  .option-btn.o-no-late    { background: var(--no-late);    color: var(--col-no-late); }
  .option-btn.o-no-night   { background: var(--no-night);   color: var(--col-no-night); }
  .option-btn.o-night-wish { background: var(--night-wish); color: var(--col-night-wish); }
  .option-btn.o-off-req    { background: var(--off-req);    color: var(--col-off-req); }
  .option-btn.o-late-wish  { background: var(--late-wish);  color: var(--col-late-wish); }
  .option-btn.o-paid-leave { background: var(--paid-leave); color: var(--col-paid-leave); }

  #popover {
    position: fixed; z-index: 50;
    background: white; border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
    padding: 6px; min-width: 168px;
    display: none; flex-direction: column; gap: 2px;
    pointer-events: auto; border: 1px solid #e2e8f0;
  }
  #popover.open { display: flex; }
  #popover::before { content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); border:7px solid transparent; border-bottom:none; border-top-color:white; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.06)); }
  #popover.below::before { bottom:auto; top:-7px; border-top:none; border-bottom-color:white; }
  .pop-btn { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; border:none; font-size:13px; font-weight:600; text-align:left; cursor:pointer; width:100%; background:#f8fafc; color:#475569; }
  .pop-btn:hover { filter:brightness(0.96); }
  .pop-btn.selected { outline:2px solid currentColor; }
  .pop-btn.disabled { opacity:0.35; cursor:not-allowed; }
  .pop-btn .pop-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
  .pop-btn.p-no-late    { background:var(--no-late);    color:var(--col-no-late); }
  .pop-btn.p-no-night   { background:var(--no-night);   color:var(--col-no-night); }
  .pop-btn.p-night-wish { background:var(--night-wish); color:var(--col-night-wish); }
  .pop-btn.p-off-req    { background:var(--off-req);    color:var(--col-off-req); }
  .pop-btn.p-late-wish  { background:var(--late-wish);  color:var(--col-late-wish); }
  .pop-btn.p-paid-leave { background:var(--paid-leave); color:var(--col-paid-leave); }
  .pop-limit { font-size:10px; opacity:0.65; margin-left:auto; }
  .pop-btn.not-applicable   { background:#f1f5f9 !important; color:#b0bec5 !important; opacity:0.55; cursor:not-allowed; }
  .option-btn.not-applicable { background:#f1f5f9 !important; color:#b0bec5 !important; opacity:0.45; cursor:not-allowed; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:60; align-items:flex-end; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:white; border-radius:24px 24px 0 0; padding:24px 20px env(safe-area-inset-bottom,24px); width:100%; max-width:480px; }
  .modal-title { font-size:18px; font-weight:800; color:#1e293b; margin-bottom:16px; }
  .modal-summary { background:#f8fafc; border-radius:12px; padding:14px 16px; margin-bottom:20px; }
  .modal-summary-row { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
  .modal-summary-row .label { color:#64748b; }
  .modal-summary-row .value { font-weight:700; color:#1e293b; }
  .modal-actions { display:flex; gap:10px; }
  .modal-cancel  { flex:1; padding:14px; border-radius:12px; border:2px solid #e2e8f0; background:white; font-size:15px; font-weight:700; color:#475569; cursor:pointer; }
  .modal-confirm { flex:2; padding:14px; border-radius:12px; border:none; background:#1d4ed8; color:white; font-size:15px; font-weight:800; cursor:pointer; }
  .modal-confirm:hover { background:#1e40af; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>📅 シフト希望入力</h1>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div>
  <div class="nurse-info" id="nurse-info">読み込み中...</div>
</header>

<div id="deadline-banner" style="display:none"></div>

<div class="month-nav">
  <button id="prev-btn" onclick="changeMonth(-1)">‹</button>
  <h2 id="month-title"></h2>
  <button id="next-btn" onclick="changeMonth(1)">›</button>
</div>

<div class="counters" id="counters"></div>
<div class="legend" id="legend"></div>

<div class="calendar-wrap">
  <div class="weekdays">
    <div class="weekday sun">日</div><div class="weekday">月</div><div class="weekday">火</div>
    <div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div>
    <div class="weekday sat">土</div>
  </div>
  <div class="calendar-grid" id="calendar"></div>
</div>

<div class="note-section">
  <div class="note-label">📝 備考（旅行・通院・連休希望など）</div>
  <textarea class="note-textarea" id="note-input" placeholder="例: 8/10〜8/12は旅行のため連休希望"></textarea>
  <div class="note-saved" id="note-saved"></div>
</div>

<div class="score-section" id="score-section" style="display:none">
  <div class="score-title">📊 今月の入力状況 <span id="score-month-label" style="font-weight:400;font-size:12px;color:#64748b"></span></div>
  <div class="score-grid" style="grid-template-columns:1fr 1fr 1fr 1fr;">
    <div class="score-item">
      <div class="score-val" id="score-off">—</div>
      <div class="score-unit">日</div>
      <div class="score-desc">公休希望</div>
    </div>
    <div class="score-item">
      <div class="score-val" id="score-paid">—</div>
      <div class="score-unit">日</div>
      <div class="score-desc">有給希望</div>
    </div>
    <div class="score-item">
      <div class="score-val" id="score-late">—</div>
      <div class="score-unit">回</div>
      <div class="score-desc">遅出希望</div>
    </div>
    <div class="score-item">
      <div class="score-val" id="score-night">—</div>
      <div class="score-unit">回</div>
      <div class="score-desc">夜勤希望</div>
    </div>
  </div>
  <div id="score-submit-status" style="margin-top:8px;font-size:12px;color:#64748b;text-align:center;"></div>
</div>

<div class="submit-bar">
  <button class="submit-btn" id="submit-btn" onclick="openSubmitModal()">提出する</button>
  <button class="unsubmit-btn" id="unsubmit-btn" onclick="openUnsubmitModal()" style="display:none">取り消す</button>
</div>

<div id="popover"></div>

<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-date" id="sheet-date"></div>
  <div class="sheet-options" id="sheet-options"></div>
</div>

<div class="modal-overlay" id="submit-modal">
  <div class="modal">
    <div class="modal-title">📤 提出の確認</div>
    <div class="modal-summary" id="submit-summary"></div>
    <p style="font-size:12px;color:#94a3b8;margin-bottom:16px;">提出後は変更できません。内容を確認してから提出してください。</p>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeSubmitModal()">戻る</button>
      <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmSubmit()">提出する</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="unsubmit-modal">
  <div class="modal">
    <div class="modal-title">↩️ 提出を取り消す</div>
    <p style="font-size:13px;color:#4a5568;margin-bottom:8px;">提出を取り消して再入力できるようになります。</p>
    <p style="font-size:12px;color:#dc2626;margin-bottom:16px;">⚠️ 締め切り後は取り消しできません。</p>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeUnsubmitModal()">戻る</button>
      <button class="modal-confirm" style="background:#dc2626" onclick="confirmUnsubmit()">取り消す</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const token    = localStorage.getItem('token');
const userInfo = JSON.parse(localStorage.getItem('user') || 'null');
if (!token || !userInfo) location.href = '/index.html';

const api = (path, opts = {}) => fetch(path, {
  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
  ...opts
}).then(r => r.json());

const DAY_NAMES = ['日','月','火','水','木','金','土'];

const OPTIONS_DEF = {
  available:   { icon: '○',  name: '勤務可',   desc: 'どのシフトも対応できます',     cls: 'p-available',   ocls: 'o-available',   label: '可' },
  no_late:     { icon: '夕', name: '遅出不可', desc: '日勤のみ対応できます',         cls: 'p-no-late',     ocls: 'o-no-late',     label: '遅×' },
  no_night:    { icon: '🌙', name: '夜勤不可', desc: '日勤・遅出は対応できます',     cls: 'p-no-night',    ocls: 'o-no-night',    label: '夜×' },
  late_wish:   { icon: '🌅', name: '日勤or遅出までなら可', desc: '日勤・遅出どちらも対応できます（夜勤は不可）', cls: 'p-late-wish',   ocls: 'o-late-wish',   label: '🌅遅' },
  night_wish:  { icon: '★',  name: '夜勤希望', desc: 'この日の夜勤を希望します',     cls: 'p-night-wish',  ocls: 'o-night-wish',  label: '★夜' },
  paid_leave:  { icon: '💰', name: '有給希望', desc: '有給休暇を希望します',         cls: 'p-paid-leave',  ocls: 'o-paid-leave',  label: '有給' },
  off_request: { icon: '🏖', name: '公休希望', desc: '公休を希望します',             cls: 'p-off-req',     ocls: 'o-off-req',     label: '休' },
};

const WORK_TYPE_OPTIONS = {
  day_only: ['available', 'paid_leave', 'off_request'],
  day_late: ['available', 'no_late', 'late_wish', 'paid_leave', 'off_request'],
  full:     ['available', 'no_late', 'no_night', 'late_wish', 'night_wish', 'paid_leave', 'off_request'],
};
// ポップオーバーに全選択肢を表示する順序（勤務区分外はグレーアウト）
const ALL_OPTIONS = ['available', 'no_late', 'no_night', 'late_wish', 'night_wish', 'paid_leave', 'off_request'];

const MAX_NIGHT_WISH = 4;
const MAX_LATE_WISH  = 4;

const isTouch = window.matchMedia('(pointer: coarse)').matches;

let nurse = null;
let prefs = {};
let submitted = false;
let maxOffDays = null;
let targetYear, targetMonth;
let deadlineDate = null;
let deadlineTimer = null;
let popoverTimer  = null;
let popoverDate   = null;

const today = new Date();
const defaultTarget = new Date(today.getFullYear(), today.getMonth() + 1, 1);
targetYear  = defaultTarget.getFullYear();
targetMonth = defaultTarget.getMonth() + 1;

async function init() {
  try {
    // /api/me とカレンダーデータを並列取得
    const [meData, prefList, config, settings] = await Promise.all([
      api('/api/me'),
      api(`/api/preferences?year=${targetYear}&month=${targetMonth}`),
      api(`/api/shift-config/${targetYear}/${targetMonth}`),
      api('/api/settings')
    ]);

    nurse = meData;
    if (nurse.role === 'admin') { location.href = '/admin-master.html'; return; }

    const wtLabel = { day_only:'日勤のみ', day_late:'遅出まで', full:'夜勤まで' }[nurse.work_type] || '';
    const skLabel = { trainee:'みならい', half:'0.5人前', skilled:'1人前' }[nurse.skill_level] || '';
    document.getElementById('nurse-info').innerHTML =
      `${nurse.name}<span class="nurse-badge">${wtLabel}</span><span class="nurse-badge">${skLabel}</span>`;

    renderLegend();
    loadNote();
    applyMonthData(prefList, config, settings);
    loadMyStats();
  } catch (e) {
    showToast('読み込みエラー');
  }
}

function renderLegend() {
  if (!nurse) return;
  const opts = WORK_TYPE_OPTIONS[nurse.work_type] || ['available', 'off_request'];
  const clsMap = {
    available: 'l-available', no_late: 'l-no-late', no_night: 'l-no-night',
    night_wish: 'l-night-wish', off_request: 'l-off-req',
    late_wish: 'l-late-wish', paid_leave: 'l-paid-leave'
  };
  document.getElementById('legend').innerHTML =
    '<div class="legend-inner">' +
    opts.map(k => `<span class="legend-item ${clsMap[k]}">${OPTIONS_DEF[k].icon} ${OPTIONS_DEF[k].name}</span>`).join('') +
    '</div>';
}

async function loadMonth() {
  prefs = {};
  submitted = false;
  deadlineDate = null;

  const [prefList, config, settings] = await Promise.all([
    api(`/api/preferences?year=${targetYear}&month=${targetMonth}`),
    api(`/api/shift-config/${targetYear}/${targetMonth}`),
    api(`/api/settings`)
  ]);

  applyMonthData(prefList, config, settings);
}

function applyMonthData(prefList, config, settings) {
  prefs = {};
  submitted = false;
  deadlineDate = null;

  prefList.forEach(p => {
    prefs[p.date] = p.preference;
    if (p.is_submitted) submitted = true;
  });

  maxOffDays = config?.max_off_days ?? null;

  const deadlineDay = parseInt(settings?.deadline_day);
  if (deadlineDay >= 1 && deadlineDay <= 31) {
    deadlineDate = new Date(targetYear, targetMonth - 2, deadlineDay, 23, 59, 59);
  }

  renderMonth();
  renderCounters();
  renderSubmitBtn();
  renderDeadlineBanner();
  startDeadlineTimer();
}

function isAutoOff(dow) {
  return nurse?.work_type === 'day_only' && (dow === 0 || dow === 6);
}

function renderMonth() {
  document.getElementById('month-title').textContent = `${targetYear}年${targetMonth}月`;

  const minMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  const maxMonth = new Date(today.getFullYear(), today.getMonth() + 3, 1);
  const cur = new Date(targetYear, targetMonth - 1, 1);
  document.getElementById('prev-btn').disabled = cur <= minMonth;
  document.getElementById('next-btn').disabled = cur >= maxMonth;

  const grid = document.getElementById('calendar');
  grid.innerHTML = '';

  const firstDay   = new Date(targetYear, targetMonth - 1, 1).getDay();
  const daysInMonth = new Date(targetYear, targetMonth, 0).getDate();
  const todayStr   = toDateStr(today);
  const locked     = submitted || isDeadlinePassed();

  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement('div');
    e.className = 'day-cell empty';
    grid.appendChild(e);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${targetYear}-${String(targetMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow  = new Date(targetYear, targetMonth - 1, d).getDay();
    const autoOff = isAutoOff(dow);

    if (autoOff) {
      // 日勤専任の土日 → 自動休（非インタラクティブ）
      const cell = document.createElement('div');
      cell.className = 'day-cell auto-off locked' +
        (dow === 0 ? ' sunday' : ' saturday') +
        (dateStr === todayStr ? ' today' : '');
      cell.dataset.pref = 'available';
      cell.innerHTML = `<span class="day-num">${d}</span><span class="day-label">自動休</span>`;
      grid.appendChild(cell);
      continue;
    }

    const pref = prefs[dateStr] || 'available';
    const opt  = OPTIONS_DEF[pref];

    const cell = document.createElement('div');
    cell.className = 'day-cell'
      + (dow === 0 ? ' sunday'   : '')
      + (dow === 6 ? ' saturday' : '')
      + (dateStr === todayStr ? ' today' : '')
      + (locked ? ' locked' : '');
    cell.dataset.pref = pref;
    cell.dataset.date = dateStr;
    cell.innerHTML = `<span class="day-num">${d}</span><span class="day-label">${opt.label}</span>`;

    if (!locked) {
      if (isTouch) {
        cell.addEventListener('click', () => openSheet(dateStr, dow));
      } else {
        cell.addEventListener('mouseenter', () => showPopover(dateStr, cell));
        cell.addEventListener('mouseleave', () => scheduleHidePopover());
      }
    }
    grid.appendChild(cell);
  }
}

function renderCounters() {
  const offCount   = Object.values(prefs).filter(p => p === 'off_request').length;
  const paidCount  = Object.values(prefs).filter(p => p === 'paid_leave').length;
  const lateCount  = Object.values(prefs).filter(p => p === 'late_wish').length;
  const nightCount = Object.values(prefs).filter(p => p === 'night_wish').length;
  const changedCount = Object.values(prefs).filter(p => p !== 'available').length;
  const chips = [];

  if (submitted) chips.push(`<span class="chip submitted">✅ 提出済み</span>`);

  chips.push(`<span class="chip off${maxOffDays !== null && (offCount + paidCount) > maxOffDays ? ' warn' : ''}">🏖 公休 ${offCount}日</span>`);

  if (paidCount > 0)
    chips.push(`<span class="chip paid">💰 有給 ${paidCount}日</span>`);

  if (nurse?.work_type === 'day_late' || nurse?.work_type === 'full')
    chips.push(`<span class="chip late${lateCount > MAX_LATE_WISH ? ' warn' : ''}">🌅 遅出希望 ${lateCount}/${MAX_LATE_WISH}日</span>`);

  if (nurse?.work_type === 'full')
    chips.push(`<span class="chip night${nightCount > MAX_NIGHT_WISH ? ' warn' : ''}">★ 夜勤希望 ${nightCount}/${MAX_NIGHT_WISH}日</span>`);

  if (changedCount > 0 && !submitted)
    chips.push(`<span class="chip progress">${changedCount}日 入力済み</span>`);

  document.getElementById('counters').innerHTML = chips.join('');
}

function renderSubmitBtn() {
  const btn  = document.getElementById('submit-btn');
  const ubtn = document.getElementById('unsubmit-btn');
  const canUnsubmit = submitted && !isDeadlinePassed();

  if (submitted && isDeadlinePassed()) {
    btn.textContent = '🔒 提出済み（変更不可）'; btn.disabled = true;
    btn.className = 'submit-btn expired';
    ubtn.style.display = 'none';
  } else if (submitted) {
    btn.textContent = '✅ 提出済み'; btn.disabled = true;
    btn.className = 'submit-btn submitted';
    ubtn.style.display = '';
  } else if (isDeadlinePassed()) {
    btn.textContent = '🔒 締め切り済み'; btn.disabled = true;
    btn.className = 'submit-btn expired';
    ubtn.style.display = 'none';
  } else {
    btn.textContent = '提出する'; btn.disabled = false;
    btn.className = 'submit-btn';
    ubtn.style.display = 'none';
  }
}

function openUnsubmitModal()  { document.getElementById('unsubmit-modal').classList.add('open'); }
function closeUnsubmitModal() { document.getElementById('unsubmit-modal').classList.remove('open'); }

async function confirmUnsubmit() {
  closeUnsubmitModal();
  try {
    const result = await api('/api/preferences/unsubmit', {
      method: 'POST',
      body: JSON.stringify({ year: targetYear, month: targetMonth })
    });
    if (result.error) { showToast(result.error); return; }
    submitted = false;
    renderMonth();
    renderCounters();
    renderSubmitBtn();
    loadMyStats();
    showToast('提出を取り消しました');
  } catch { showToast('取り消しに失敗しました'); }
}

function renderDeadlineBanner() {
  const banner = document.getElementById('deadline-banner');
  if (!deadlineDate) { banner.style.display = 'none'; return; }

  const now    = new Date();
  const diffMs = deadlineDate - now;
  const diffDays  = Math.floor(diffMs / 86400000);
  const diffHours = Math.floor((diffMs % 86400000) / 3600000);
  const diffMins  = Math.floor((diffMs % 3600000)  / 60000);
  const dateStr = deadlineDate.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric' });

  let cls, icon, text, daysLabel;
  if (diffMs <= 0) {
    cls = 'expired'; icon = '🔒'; text = `締め切り済み（${dateStr} 23:59）`; daysLabel = '';
  } else if (diffDays < 1) {
    cls = 'urgent'; icon = '🚨'; text = `${dateStr} 23:59 締め切り`; daysLabel = `${diffHours}時間${diffMins}分`;
  } else if (diffDays <= 3) {
    cls = 'warning'; icon = '⚠️'; text = `${dateStr} 23:59 締め切り`; daysLabel = `あと${diffDays}日！`;
  } else {
    cls = 'safe'; icon = '📅'; text = `${dateStr} 23:59 締め切り`; daysLabel = `あと${diffDays}日`;
  }

  banner.style.display = '';
  banner.className = `deadline-banner ${cls}`;
  banner.innerHTML = `<span>${icon}</span><span>${text}</span>${daysLabel ? `<span class="deadline-days">${daysLabel}</span>` : ''}`;
}

function startDeadlineTimer() {
  if (deadlineTimer) clearInterval(deadlineTimer);
  if (!deadlineDate) return;
  deadlineTimer = setInterval(() => {
    renderDeadlineBanner();
    if (new Date() > deadlineDate) {
      clearInterval(deadlineTimer); deadlineTimer = null;
      renderMonth(); renderSubmitBtn();
    }
  }, 30000);
}

function isDeadlinePassed() {
  return deadlineDate ? new Date() > deadlineDate : false;
}

// ─── ポップオーバー（デスクトップ） ───
function showPopover(dateStr, cell) {
  clearTimeout(popoverTimer);
  popoverDate = dateStr;
  const pop = document.getElementById('popover');
  const allowed = WORK_TYPE_OPTIONS[nurse.work_type] || ['available', 'off_request'];
  const current = prefs[dateStr] || 'available';
  const nightCount = Object.values(prefs).filter(p => p === 'night_wish').length;
  const lateCount  = Object.values(prefs).filter(p => p === 'late_wish').length;

  pop.innerHTML = ALL_OPTIONS.map(key => {
    const o = OPTIONS_DEF[key];
    const sel = current === key;
    const na       = !allowed.includes(key);
    const disNight = key === 'night_wish' && nightCount >= MAX_NIGHT_WISH && !sel;
    const disLate  = key === 'late_wish'  && lateCount  >= MAX_LATE_WISH  && !sel;
    const dis = na || disNight || disLate;
    const badge = na ? '対象外' : (disNight || disLate) ? '上限' : '';
    return `<button class="pop-btn ${o.cls}${sel?' selected':''}${dis?' disabled':''}${na?' not-applicable':''}"
      onclick="${dis ? '' : `popSelect('${key}')`}"
      onmouseenter="clearTimeout(popoverTimer)"
      onmouseleave="scheduleHidePopover()">
      <span class="pop-icon">${o.icon}</span><span>${o.name}</span>
      ${badge ? `<span class="pop-limit">${badge}</span>` : ''}
      ${sel ? '<span style="margin-left:auto">✓</span>' : ''}
    </button>`;
  }).join('');

  const rect = cell.getBoundingClientRect();
  const popW = 180;
  let left = rect.left + rect.width / 2 - popW / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));

  const popH = ALL_OPTIONS.length * 38 + 16;
  const showBelow = rect.top < popH + 20;
  pop.classList.toggle('below', showBelow);
  pop.style.left  = left + 'px';
  pop.style.width = popW + 'px';
  if (showBelow) { pop.style.top = (rect.bottom + 6) + 'px'; pop.style.bottom = 'auto'; }
  else           { pop.style.top = 'auto'; pop.style.bottom = (window.innerHeight - rect.top + 6) + 'px'; }
  pop.classList.add('open');
}

function scheduleHidePopover() {
  popoverTimer = setTimeout(() => {
    document.getElementById('popover').classList.remove('open');
    popoverDate = null;
  }, 120);
}

async function popSelect(key) {
  if (!popoverDate) return;
  const d = popoverDate;
  document.getElementById('popover').classList.remove('open');
  await savePref(d, key);
}

// ─── ボトムシート（タッチ） ───
function openSheet(dateStr, dow) {
  if (submitted || isDeadlinePassed()) return;
  const d = new Date(dateStr);
  document.getElementById('sheet-date').textContent = `${d.getMonth()+1}月${d.getDate()}日（${DAY_NAMES[dow]}）`;

  const allowed = WORK_TYPE_OPTIONS[nurse.work_type] || ['available', 'off_request'];
  const current = prefs[dateStr] || 'available';
  const nightCount = Object.values(prefs).filter(p => p === 'night_wish').length;
  const lateCount  = Object.values(prefs).filter(p => p === 'late_wish').length;

  document.getElementById('sheet-options').innerHTML = ALL_OPTIONS.map(key => {
    const o   = OPTIONS_DEF[key];
    const sel = current === key;
    const na       = !allowed.includes(key);
    const disNight = key === 'night_wish' && nightCount >= MAX_NIGHT_WISH && !sel;
    const disLate  = key === 'late_wish'  && lateCount  >= MAX_LATE_WISH  && !sel;
    const dis = na || disNight || disLate;
    const subLabel = na ? '（あなたの勤務区分では対象外）'
      : disNight ? `（上限 ${MAX_NIGHT_WISH}回）`
      : disLate  ? `（上限 ${MAX_LATE_WISH}回）` : '';
    return `<button class="option-btn ${o.ocls}${sel?' selected':''}${dis?' disabled':''}${na?' not-applicable':''}"
      onclick="${dis ? '' : `sheetSelect('${dateStr}','${key}')`}">
      <span class="opt-icon">${o.icon}</span>
      <span><div class="opt-name">${o.name}</div><div class="opt-desc">${na ? subLabel : o.desc + subLabel}</div></span>
      ${sel ? '<span class="opt-check">✓</span>' : ''}
    </button>`;
  }).join('');

  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

async function sheetSelect(dateStr, key) {
  closeSheet();
  await savePref(dateStr, key);
}

// ─── 保存 ───
async function savePref(dateStr, pref) {
  const prev = prefs[dateStr] || 'available';
  if (prev === pref) return;
  prefs[dateStr] = pref;
  renderMonth();
  renderCounters();
  try {
    const result = await api('/api/preferences', { method: 'PUT', body: JSON.stringify({ date: dateStr, preference: pref }) });
    if (result.error) throw new Error(result.error);
    showToast('保存しました');
  } catch (err) {
    prefs[dateStr] = prev;
    renderMonth(); renderCounters();
    showToast(err.message || '保存に失敗しました');
  }
}

// ─── 提出確認モーダル ───
function openSubmitModal() {
  if (isDeadlinePassed()) { showToast('締め切りを過ぎているため提出できません'); return; }
  const offCount   = Object.values(prefs).filter(p => p === 'off_request').length;
  const paidCount  = Object.values(prefs).filter(p => p === 'paid_leave').length;
  const lateCount  = Object.values(prefs).filter(p => p === 'late_wish').length;
  const nightCount = Object.values(prefs).filter(p => p === 'night_wish').length;
  const deadlineStr = deadlineDate ? deadlineDate.toLocaleDateString('ja-JP', { month:'long', day:'numeric' }) : '未設定';

  let rows = `
    <div class="modal-summary-row"><span class="label">対象月</span><span class="value">${targetYear}年${targetMonth}月</span></div>
    <div class="modal-summary-row"><span class="label">公休希望</span><span class="value">${offCount}日</span></div>
    <div class="modal-summary-row"><span class="label">有給希望</span><span class="value">${paidCount}日</span></div>`;

  if (nurse?.work_type !== 'day_only') {
    rows += `<div class="modal-summary-row"><span class="label">遅出希望</span><span class="value">${lateCount}日</span></div>`;
  }
  if (nurse?.work_type === 'full') {
    rows += `<div class="modal-summary-row"><span class="label">夜勤希望</span><span class="value">${nightCount}日</span></div>`;
  }

  const confirmBtn = document.getElementById('modal-confirm-btn');
  if (maxOffDays !== null && (offCount + paidCount) > maxOffDays) {
    document.getElementById('submit-summary').innerHTML =
      `<p style="color:#b91c1c;font-weight:700;">公休・有給の合計（${offCount + paidCount}日）が上限（${maxOffDays}日）を超えています。調整してから提出してください。</p>`;
    confirmBtn.disabled = true;
  } else {
    document.getElementById('submit-summary').innerHTML = rows;
    confirmBtn.disabled = false;
  }
  document.getElementById('submit-modal').classList.add('open');
}

function closeSubmitModal() {
  document.getElementById('submit-modal').classList.remove('open');
}

async function confirmSubmit() {
  closeSubmitModal();
  try {
    await api('/api/preferences/submit', { method: 'POST', body: JSON.stringify({ year: targetYear, month: targetMonth }) });
    submitted = true;
    renderMonth(); renderCounters(); renderSubmitBtn();
    showToast('提出しました！');
    loadMyStats();
  } catch { showToast('提出に失敗しました'); }
}

// ─── 自分のスコア ───
async function loadMyStats() {
  try {
    const stats = await api(`/api/my-stats?year=${targetYear}&month=${targetMonth}`);
    const el = document.getElementById('score-section');
    if (!stats || stats.error) return;
    document.getElementById('score-month-label').textContent = `${targetYear}年${targetMonth}月`;
    document.getElementById('score-off').textContent   = stats.off_request_count  ?? 0;
    document.getElementById('score-paid').textContent  = stats.paid_leave_count   ?? 0;
    document.getElementById('score-late').textContent  = stats.late_wish_count    ?? 0;
    document.getElementById('score-night').textContent = stats.night_wish_count   ?? 0;
    const statusEl = document.getElementById('score-submit-status');
    if (stats.is_submitted && stats.submitted_at) {
      const d = new Date(stats.submitted_at);
      statusEl.textContent = `✅ 提出済み（${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}）`;
      statusEl.style.color = '#276749';
    } else {
      statusEl.textContent = '未提出';
      statusEl.style.color = '#94a3b8';
    }
    el.style.display = '';
  } catch {}
}

// ─── 備考（LocalStorage） ───
function noteKey() { return `shift_note_${userInfo.id}_${targetYear}_${targetMonth}`; }

function loadNote() {
  const ta = document.getElementById('note-input');
  if (!ta) return;
  ta.value = localStorage.getItem(noteKey()) || '';
}

function saveNote() {
  const ta = document.getElementById('note-input');
  if (!ta) return;
  localStorage.setItem(noteKey(), ta.value);
  const el = document.getElementById('note-saved');
  el.textContent = '保存しました';
  setTimeout(() => { el.textContent = ''; }, 2000);
}

document.getElementById('note-input').addEventListener('blur', saveNote);

function changeMonth(delta) {
  if (deadlineTimer) { clearInterval(deadlineTimer); deadlineTimer = null; }
  document.getElementById('popover').classList.remove('open');
  const d = new Date(targetYear, targetMonth - 1 + delta, 1);
  targetYear = d.getFullYear(); targetMonth = d.getMonth() + 1;
  loadNote();
  loadMonth();
}

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function logout() { localStorage.clear(); location.href = '/index.html'; }

init();
</script>
