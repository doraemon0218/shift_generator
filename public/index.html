<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手術室シフト管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }

  .card { background: white; border-radius: 16px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo h1 { font-size: 20px; color: #1a365d; font-weight: 800; }
  .logo p  { color: #718096; font-size: 13px; margin-top: 4px; }

  /* 役割セレクター */
  .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
  .role-tab {
    padding: 14px 8px; border-radius: 10px; border: 2px solid #e2e8f0;
    cursor: pointer; text-align: center; transition: all 0.2s; background: #f8fafc;
  }
  .role-tab.active { border-color: #2b6cb0; background: #ebf4ff; }
  .role-tab .icon { font-size: 24px; display: block; margin-bottom: 4px; }
  .role-tab .label { font-size: 13px; font-weight: 700; color: #4a5568; }
  .role-tab.active .label { color: #2b6cb0; }

  /* パネル */
  .section { display: none; }
  .section.active { display: block; }

  /* 管理者1クリック */
  .admin-btn {
    width: 100%; padding: 16px; border-radius: 10px; border: none;
    background: #1a365d; color: white; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: background 0.2s; letter-spacing: 0.02em;
  }
  .admin-btn:hover { background: #2c5282; }
  .admin-note { font-size: 11px; color: #a0aec0; text-align: center; margin-top: 8px; }

  /* スタッフログイン */
  label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 4px; font-weight: 500; }
  input { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; font-size: 15px; margin-bottom: 14px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #4299e1; }
  .login-btn { width: 100%; background: #2b6cb0; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; font-weight: 700; transition: background 0.2s; }
  .login-btn:hover { background: #2c5282; }

  .divider { text-align: center; margin: 16px 0; color: #a0aec0; font-size: 12px; position: relative; }
  .divider::before, .divider::after { content:''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e2e8f0; }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .register-btn {
    width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #e2e8f0;
    background: white; color: #4a5568; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .register-btn:hover { border-color: #2b6cb0; color: #2b6cb0; background: #ebf4ff; }

  .error { color: #e53e3e; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

  /* デモバナー */
  .demo-banner { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-size: 12px; color: #92400e; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🏥 手術室シフト管理</h1>
    <p>手術部 勤務希望入力システム</p>
  </div>

  <div class="demo-banner">
    📋 デモ版 — 看護師スタッフ30名が登録済みです
  </div>

  <div class="role-tabs">
    <div class="role-tab" id="tab-admin" onclick="selectRole('admin')">
      <span class="icon">👩‍💼</span>
      <span class="label">管理者</span>
    </div>
    <div class="role-tab active" id="tab-staff" onclick="selectRole('staff')">
      <span class="icon">👩‍⚕️</span>
      <span class="label">スタッフ</span>
    </div>
  </div>

  <!-- 管理者セクション -->
  <div class="section" id="section-admin">
    <button class="admin-btn" onclick="adminLogin()">管理者として入る</button>
    <p class="admin-note">※ デモ用：パスワードなしで入れます</p>
  </div>

  <!-- スタッフセクション -->
  <div class="section active" id="section-staff">
    <label>ログインID</label>
    <input type="text" id="username" placeholder="ログインIDを入力" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
    <button class="login-btn" onclick="login()">ログイン</button>
    <div class="divider">または</div>
    <button class="register-btn" onclick="location.href='/nurse-setup.html'">
      初めての方はこちら（新規登録）
    </button>
  </div>

  <div class="error" id="error"></div>
</div>

<script>
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (token && user) {
    location.href = user.role === 'admin' ? '/admin-master.html' : '/nurse-input.html';
  }

  function selectRole(role) {
    document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
    document.getElementById('tab-staff').classList.toggle('active', role === 'staff');
    document.getElementById('section-admin').classList.toggle('active', role === 'admin');
    document.getElementById('section-staff').classList.toggle('active', role === 'staff');
    document.getElementById('error').textContent = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('section-staff').classList.contains('active')) login();
  });

  async function adminLogin() {
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'admin', password: 'admin1234' })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error); return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      location.href = '/admin-master.html';
    } catch {
      showError('サーバーに接続できません');
    }
  }

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showError('ログインIDとパスワードを入力してください'); return; }
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error); return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      location.href = '/nurse-input.html';
    } catch {
      showError('サーバーに接続できません');
    }
  }

  function showError(msg) { document.getElementById('error').textContent = msg; }
</script>
</body>
</html>
