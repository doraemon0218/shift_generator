<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手術室シフト管理 - ログイン</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: white; border-radius: 12px; padding: 40px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
  h1 { text-align: center; font-size: 20px; color: #1a365d; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #718096; font-size: 13px; margin-bottom: 32px; }
  label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 4px; font-weight: 500; }
  input { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; font-size: 15px; margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #4299e1; }
  button { width: 100%; background: #2b6cb0; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
  button:hover { background: #2c5282; }
  .error { color: #e53e3e; font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>🏥 手術室シフト管理</h1>
  <p class="subtitle">ログインしてください</p>
  <label>ユーザー名</label>
  <input type="text" id="username" placeholder="admin" autocomplete="username">
  <label>パスワード</label>
  <input type="password" id="password" placeholder="パスワード" autocomplete="current-password">
  <button onclick="login()">ログイン</button>
  <div class="error" id="error"></div>
</div>
<script>
  // 既にログイン済みなら転送
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  if (token && user) {
    location.href = user.role === 'admin' ? '/admin-master.html' : '/nurse-input.html';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showError('ユーザー名とパスワードを入力してください'); return; }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error); return; }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      location.href = data.user.role === 'admin' ? '/admin-master.html' : '/nurse-input.html';
    } catch {
      showError('サーバーに接続できません');
    }
  }

  function showError(msg) { document.getElementById('error').textContent = msg; }
</script>
</body>
</html>
